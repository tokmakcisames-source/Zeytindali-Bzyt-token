<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google SEO Ayarları -->
    <title>Zeytindalı BZYT · Abdusselam Tokmakçı · Resmi Asistan</title>
    <meta name="description" content="Zeytindalı Token (BZYT), tarım, hayvancılık ve blockchain teknolojisiyle ihtiyaç sahiplerine sürdürülebilir destek sağlayan, Abdusselam Tokmakçı tarafından kurulmuş resmi blockchain yardım projesidir.">
    <meta name="keywords" content="Zeytindalı, Zeytindalı Token, BZYT, BZYT Token, Abdusselam Tokmakçı, Blockchain Yardım Projesi, Base Ağı, Tarım, Hayvancılık">
    <meta name="author" content="Abdusselam Tokmakçı">
    <meta name="robots" content="index, follow">
    
    <!-- YouTube Kanal Bağlantısı -->
    <link rel="me" href="https://youtube.com/@zeytindalibzyt">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .gradient-bg { background: linear-gradient(135deg, #1b5e20 0%, #000000 100%); }
        .bzyt-green { color: #81c784; }
        .btn-primary { background: #2e7d32; transition: 0.3s; }
        .btn-primary:hover { background: #388e3c; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="min-h-screen gradient-bg flex flex-col items-center justify-center text-center px-6">
        <h1 class="text-4xl md:text-6xl font-black mb-4 uppercase tracking-tighter">Zeytindalı <span class="bzyt-green">BZYT</span></h1>
        <p class="text-lg md:text-xl text-gray-400 max-w-2xl mb-10 leading-relaxed">
            Belki de en büyük fırsatlar, tıklamadan geçtiğimiz bağlantıların arkasındadır. 🌿
        </p>
        
        <div class="flex flex-wrap justify-center gap-4">
            <a href="https://t.me/Bzyt_zeytindali_2026_bot" target="_blank" class="btn-primary px-8 py-4 rounded-full font-bold flex items-center gap-2">
                🤖 Telegram Botu
            </a>
            <a href="https://youtube.com/@zeytindalibzyt" target="_blank" class="border border-gray-700 hover:bg-gray-800 px-8 py-4 rounded-full font-bold transition">
                📺 YouTube Kanalı
            </a>
        </div>
    </div>

    <!-- AI Sohbet Penceresi (Widget) -->
    <div id="bzyt-chat-widget" style="position: fixed; bottom: 25px; right: 25px; z-index: 10000;">
        <div id="chat-bubble" onclick="toggleChat()" style="width: 60px; height: 60px; background: #2e7d32; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="white"><path d="M12 2C6.477 2 2 6.477 2 12c0 1.821.487 3.53 1.338 5L2 22l5-1.338C8.47 21.513 10.179 22 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>
        </div>
        <div id="chat-window" style="display: none; width: 320px; height: 450px; background: #111; border: 1px solid #333; border-radius: 15px; flex-direction: column; position: absolute; bottom: 80px; right: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;">
            <div style="background: #2e7d32; padding: 15px; font-weight: bold;">Zeytindalı AI Asistan</div>
            <div id="chat-content" style="flex: 1; padding: 15px; overflow-y: auto; font-size: 14px; line-height: 1.5;">
                <div style="margin-bottom: 10px;">Merhaba! Ben BZYT Asistanı. Kurucumuz **Abdusselam Tokmakçı**'nın vizyonuyla size yardımcı olabilirim. 🌿</div>
            </div>
            <div style="padding: 10px; border-top: 1px solid #333; display: flex;">
                <input id="chat-input" type="text" placeholder="Bir şey sorun..." style="flex: 1; background: #222; border: none; padding: 10px; border-radius: 5px; color: white; outline: none;">
                <button onclick="askAI()" style="margin-left: 10px; background: #2e7d32; padding: 10px; border-radius: 5px;">🚀</button>
            </div>
        </div>
    </div>

    <script>
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }
        function askAI() {
            const input = document.getElementById('chat-input');
            const content = document.getElementById('chat-content');
            const text = input.value.trim().toLowerCase();
            if (!text) return;
            content.innerHTML += `<div style="text-align: right; margin-bottom: 10px;"><span style="background: #333; padding: 8px 12px; border-radius: 10px;">${input.value}</span></div>`;
            
            let res = "Zeytindalı BZYT, tarım ve hayvancılık üretimini blockchain şeffaflığıyla birleştiren bir iyilik hareketidir. 🌿";
            if(text.includes("kurucu") || text.includes("kim")) res = "Kurucumuz **ABDUSSELAM TOKMAKÇI**'dır. Vizyonu, iyiliği kişilere değil şeffaf bir sisteme emanet etmektir.";
            if(text.includes("amaç") || text.includes("neden")) res = "Amacımız tarım ve hayvancılık gelirlerini ihtiyaç sahipleriyle şeffaf şekilde paylaşmaktır.";
            
            setTimeout(() => {
                content.innerHTML += `<div style="background: #2e7d3233; padding: 10px; border-radius: 10px; margin-bottom: 10px;">${res}</div>`;
                content.scrollTop = content.scrollHeight;
            }, 500);
            input.value = '';
        }
    </script>
</body>
</html>
